name: build

# Every package release must install and boot into Intent in QEMU before it ships.
# The nightly run moves the Arch snapshot to yesterday; publishing that
# build advances the update channel that devices follow.
on:
  push:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      archive_date:
        description: "Arch Linux Archive date (YYYY/MM/DD); empty uses channel/archive-date"
        required: false
      arm64_smoke:
        description: "Run the aarch64 QEMU boot test (slow: no KVM on arm64 runners)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ids:
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.ids.outputs.build_id }}
      archive_date: ${{ steps.ids.outputs.archive_date }}
      installer_tag: ${{ steps.installer.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint
        run: make lint
      - name: Pick snapshot date and build id
        id: ids
        env:
          INPUT_DATE: ${{ inputs.archive_date }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_DATE" ]; then d=$INPUT_DATE
          elif [ "$EVENT" = schedule ]; then d=$(date -u -d yesterday +%Y/%m/%d)
          else
            # Never publish a snapshot older than the one devices already have.
            d=$(cat channel/archive-date)
            p=$(gh release download channel -p channel.env -O - 2>/dev/null | sed -n 's/^ARCHIVE_DATE=//p' || true)
            if [[ $p > $d ]]; then d=$p; fi
          fi
          echo "archive_date=$d" >> "$GITHUB_OUTPUT"
          echo "build_id=$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Select a reusable installer
        id: installer
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_DATE: ${{ steps.ids.outputs.archive_date }}
        run: |
          # Empty output selects a fresh installer build.
          [[ $GITHUB_EVENT_NAME != workflow_dispatch ]] || exit 0
          release=$(gh release view --json tagName,body) || exit 0
          tag=$(jq -r .tagName <<< "$release")
          [[ $tag == iso-* ]] || exit 0
          archive=$(jq -r .body <<< "$release" | sed -nE 's/.*Arch snapshot ([0-9]{4}\/[0-9]{2}\/[0-9]{2}).*/\1/p')
          [[ $archive == "$ARCHIVE_DATE" ]] || exit 0
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null || exit 0
          # Compare to the last published installer, including changes from earlier pushes.
          if git diff --quiet "refs/tags/$tag" HEAD -- . \
            ':(exclude)packages/**' ':(exclude)docs/**' ':(exclude)README.md'; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: ids
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build packages and rebuild the installer when needed
        env:
          INTENT_OS_SIGNING_KEY: ${{ secrets.INTENT_OS_SIGNING_KEY }}
        run: make ${{ needs.ids.outputs.installer_tag != '' && 'packages' || 'image' }} ARCHIVE_DATE='${{ needs.ids.outputs.archive_date }}' BUILD_ID='${{ needs.ids.outputs.build_id }}'
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            out/iso
            out/repo
            out/keyring
            out/channel.env
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: [ids, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf socat imagemagick
      - name: Download the published x86 installer
        if: needs.ids.outputs.installer_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_TAG: ${{ needs.ids.outputs.installer_tag }}
        run: gh release download "$INSTALLER_TAG" --pattern '*-x86_64.iso' --dir out/iso
      - name: Install and boot into Intent
        timeout-minutes: 50
        run: make smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            out/smoke/*.log
            out/smoke/*.png
            out/smoke/*.ppm
            out/smoke/result.txt

  build-arm64:
    needs: ids
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 packages and rebuild the installer when needed
        env:
          INTENT_OS_SIGNING_KEY: ${{ secrets.INTENT_OS_SIGNING_KEY }}
        run: make ${{ needs.ids.outputs.installer_tag != '' && 'packages-arm64' || 'image-arm64' }} ARCHIVE_DATE='${{ needs.ids.outputs.archive_date }}' BUILD_ID='${{ needs.ids.outputs.build_id }}'
      - name: Build the Apple silicon (Asahi) image
        if: needs.ids.outputs.installer_tag == ''
        env:
          INTENT_OS_SIGNING_KEY: ${{ secrets.INTENT_OS_SIGNING_KEY }}
        run: make image-asahi ARCHIVE_DATE='${{ needs.ids.outputs.archive_date }}' BUILD_ID='${{ needs.ids.outputs.build_id }}'
      - uses: actions/upload-artifact@v4
        with:
          name: image-arm64
          path: |
            out/iso
            out/repo
            out/asahi
          if-no-files-found: error
          compression-level: 0

  # Manual only: arm64 runners have no KVM, so this takes over an hour. The
  # aarch64 ISO is tested by hand (UTM) before release; it does not gate publish.
  smoke-arm64:
    needs: build-arm64
    if: inputs.arm64_smoke == true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: out
      - name: Enable KVM when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No KVM on this runner; the test uses TCG and is slow."
          fi
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -yq qemu-system-arm qemu-efi-aarch64 qemu-utils socat imagemagick
      - name: Install and boot into Intent
        timeout-minutes: 80
        run: make smoke-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-arm64
          path: |
            out/smoke/*.log
            out/smoke/*.png
            out/smoke/*.ppm
            out/smoke/result.txt

  publish:
    needs: [ids, build, smoke, build-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: ${{ needs.ids.outputs.build_id }}
      ARCHIVE_DATE: ${{ needs.ids.outputs.archive_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: out-arm64
      - name: Publish ISOs
        if: needs.ids.outputs.installer_tag == ''
        run: |
          cat out/iso/SHA256SUMS out-arm64/iso/SHA256SUMS out-arm64/asahi/SHA256SUMS.apple-silicon > SHA256SUMS
          gh release create "iso-$BUILD_ID" out/iso/*.iso out-arm64/iso/*.iso SHA256SUMS \
            out-arm64/asahi/*.zip out-arm64/asahi/installer_data.json out-arm64/asahi/install-apple-silicon.sh \
            --title "Intent OS $BUILD_ID" \
            --notes "Netinstall ISOs for x86_64 and aarch64 (UEFI PCs, Intel Macs including T2, and VMs such as UTM on Apple silicon). Apple silicon Macs (M1, M2, untested): run install-apple-silicon.sh from macOS. Arch snapshot $ARCHIVE_DATE (x86_64). $(grep INTENT_VERSION out/channel.env)"
      - name: Publish package repos
        if: hashFiles('out/keyring/intent-os.gpg') != ''
        run: |
          for arch in x86_64 aarch64; do
            gh release view "repo-$arch" >/dev/null 2>&1 || \
              gh release create "repo-$arch" --title "Intent OS package repo ($arch)" --notes "pacman repo. Do not download by hand." --latest=false
          done
          gh release upload repo-x86_64 out/repo/* --clobber
          gh release upload repo-aarch64 out-arm64/repo/* --clobber
      - name: Advance update channel
        run: |
          gh release view channel >/dev/null 2>&1 || \
            gh release create channel --title "Intent OS update channel" --notes "Newest package build that passed the boot test." --latest=false
          gh release upload channel out/channel.env --clobber
