[ids]
# Every keyboard (keyd's * skips mice and trackpads): the Air, Apple silicon
# MacBooks, and external keyboards, where Cmd or the Windows key is Super.
*

[main]
leftmeta = layer(cmd)
rightmeta = layer(cmd)

[cmd:C]
c = M-c
v = M-v
x = M-x
# Cmd+Tab is Intent's recent-agent switcher (Super+Tab). Swap to a layer that
# holds Super until Cmd is released, so Tab and Shift+Tab step through the list
# and only releasing Cmd opens the selection.
tab = swapm(cmdtab, tab)
# Cmd+Left/Right step through Intent's windows (sway: Super+Left/Right).
left = M-left
right = M-right

[cmdtab:M]

[cmd+shift]
v = C-S-v
# Keep Cmd+Shift+Left/Right as word selection, not Super+Shift.
left = C-S-left
right = C-S-right
3 = M-S-3
4 = M-S-4

[cmd+control]
q = M-C-q
