<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntentOS Energy</title>
<style>
:root { color-scheme: light dark; font: 14px Inter, system-ui, sans-serif; }
body { max-width: 850px; margin: auto; padding: 24px; color: light-dark(#080808,#f0f0eb); background: light-dark(#f0f0eb,#161616); }
h1 { font-size: 24px; margin: 0 0 6px; }
h2 { font-size: 15px; margin: 0 0 12px; }
p { color: light-dark(#525250,#babab7); }
section { background: light-dark(#fff,#272727); padding: 16px; border-radius: 10px; margin: 12px 0; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: currentColor; font-size: 12px; }
.trace { fill: none; stroke: light-dark(#717453,#ddec61); stroke-width: 2; }
.rate { color: light-dark(#175ca8,#80baff); }
path.rate { stroke: currentColor; }
.chart { position: relative; }
.chart-tooltip {
  position: absolute; z-index: 1; pointer-events: none;
  max-width: 100%; box-sizing: border-box; padding: 6px 10px; border-radius: 6px;
  background: light-dark(#272727,#f0f0eb); color: light-dark(#fff,#161616);
  font-size: 12px; white-space: pre-line;
}
.chart-guide { stroke: currentColor; opacity: .45; pointer-events: none; }
.grid { stroke: currentColor; opacity: .15; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 0; }
td:last-child, th:last-child { text-align: right; }
</style>
<main>
<h1>Energy</h1>
<p id="latest" role="status">Loading the last 24 hours…</p>
<div id="charts"></div>
<section>
<h2>CPU activity</h2>
<p>CPU time by process name, based on the busiest processes in each sample.</p>
<table><thead><tr><th>Process</th><th>CPU minutes</th></tr></thead><tbody id="processes"></tbody></table>
</section>
</main>
<script>
const charts = document.querySelector('#charts');
const latest = document.querySelector('#latest');
const processes = document.querySelector('#processes');
const metrics = [
  ['battery_watts', 'Battery draw', 'W', 1],
  ['cpu_package_watts', 'CPU package power', 'W', 1],
  ['busy_cpu_percent', 'CPU activity (100% = one core)', '%', 100],
  ['battery_percent', 'Battery charge', '%', 100],
  ['brightness_percent', 'Screen brightness', '%', 100],
];
const svgNS = 'http://www.w3.org/2000/svg';
function element(name, attrs, value) {
  const node = document.createElementNS(svgNS, name);
  for (const [key, val] of Object.entries(attrs)) node.setAttribute(key, val);
  if (value != null) node.textContent = value;
  return node;
}
function chart(samples, [key, label, unit, floor], end) {
  const card = document.createElement('section');
  const heading = document.createElement('h2');
  heading.textContent = label;
  card.append(heading);
  const values = samples.map(sample => sample[key]).filter(Number.isFinite);
  if (!values.length) {
    const empty = document.createElement('p');
    empty.textContent = key === 'battery_watts' ? 'No unplugged readings in this period.' : 'No readings in this period.';
    card.append(empty);
    return card;
  }
  const charge = key === 'battery_percent';
  if (!charge)
    heading.textContent += ` · ${(values.reduce((a, b) => a + b, 0) / values.length).toFixed(1)} ${unit} average`;
  const top = Math.max(floor, Math.ceil(Math.max(...values)));
  const right = charge ? 575 : 648;
  const svg = element('svg', {viewBox: '0 0 660 140', role: 'img',
    'aria-label': label + (charge ? ' and change in percentage points per minute' : '') + ' over the last 24 hours'});
  for (const y of [12, 112]) svg.append(element('line', {x1: 52, x2: right, y1: y, y2: y, class: 'grid'}));
  svg.append(element('text', {x: 0, y: 16}, `${top} ${unit}`), element('text', {x: 0, y: 116}, '0'));
  svg.append(element('text', {x: 52, y: 136}, '24 hours ago'), element('text', {x: right, y: 136, 'text-anchor': 'end'}, 'Now'));

  function plot(readings, yFor, style) {
    let path = '', previous = null;
    for (const {unix_time: time, value} of readings) {
      if (!Number.isFinite(value) || time < end - 86400) { previous = null; continue; }
      const x = 52 + (right - 52) * (time - end + 86400) / 86400;
      const y = yFor(value);
      const connected = previous !== null && time - previous < 120;
      path += `${connected ? 'L' : 'M'}${x} ${y}`;
      if (!connected) svg.append(element('circle', {cx: x, cy: y, r: 2, fill: 'currentColor', class: style}));
      previous = time;
    }
    svg.append(element('path', {d: path, class: `trace ${style}`}));
  }

  plot(samples.map(sample => ({unix_time: sample.unix_time, value: sample[key]})),
    value => 112 - 100 * value / top, '');
  let rates;
  if (charge) {
    let start = 0;
    rates = samples.map((sample, index) => {
      const {unix_time, on_ac, battery_percent} = sample;
      const previous = samples[index - 1];
      if (!previous || unix_time - previous.unix_time >= 120 ||
          previous.on_ac !== on_ac || !Number.isFinite(previous.battery_percent) ||
          !Number.isFinite(battery_percent)) {
        start = index;
      }
      while (unix_time - samples[start].unix_time > 300) start++;
      const first = samples[start];
      const seconds = unix_time - first.unix_time;
      const value = seconds >= 180 && Number.isFinite(battery_percent)
        ? (battery_percent - first.battery_percent) * 60 / seconds : null;
      return {unix_time, value};
    });
    const limit = Math.max(0.5, ...rates.map(({value}) => Math.ceil(Math.abs(value) * 2) / 2));
    svg.append(element('line', {x1: 52, x2: right, y1: 62, y2: 62, class: 'grid'}));
    svg.append(element('text', {x: right + 8, y: 16, class: 'rate'}, `+${limit} pp/min`),
      element('text', {x: right + 8, y: 66, class: 'rate'}, '0'),
      element('text', {x: right + 8, y: 116, class: 'rate'}, `−${limit} pp/min`));
    plot(rates, value => 62 - 50 * value / limit, 'rate');
  }
  const plotArea = document.createElement('div');
  plotArea.className = 'chart';
  const tooltip = document.createElement('div');
  tooltip.className = 'chart-tooltip';
  tooltip.hidden = true;
  const guide = element('line', {y1: 12, y2: 112, class: 'chart-guide', visibility: 'hidden'});
  svg.append(guide);
  plotArea.append(svg, tooltip);
  card.append(plotArea);
  function hideReading() {
    tooltip.hidden = true;
    guide.setAttribute('visibility', 'hidden');
  }
  svg.addEventListener('pointerleave', hideReading);
  svg.addEventListener('pointermove', event => {
    const point = new DOMPoint(event.clientX, event.clientY)
      .matrixTransform(svg.getScreenCTM().inverse());
    if (point.x < 52 || point.x > right || point.y < 12 || point.y > 112) {
      hideReading();
      return;
    }
    const time = end - 86400 + 86400 * (point.x - 52) / (right - 52);
    let nearest = -1;
    let distance = 90;
    samples.forEach((sample, index) => {
      const delta = Math.abs(sample.unix_time - time);
      if (delta <= distance && Number.isFinite(sample[key]) && sample.unix_time >= end - 86400) {
        nearest = index;
        distance = delta;
      }
    });
    if (nearest === -1) {
      hideReading();
      return;
    }
    const sample = samples[nearest];
    const rate = rates?.[nearest]?.value;
    const x = 52 + (right - 52) * (sample.unix_time - end + 86400) / 86400;
    guide.setAttribute('x1', x);
    guide.setAttribute('x2', x);
    guide.setAttribute('visibility', 'visible');
    tooltip.textContent = [
      new Date(sample.unix_time * 1000).toLocaleString(),
      `${label} · ${sample[key].toFixed(1)} ${unit}`,
      Number.isFinite(rate) ? `Rate · ${rate.toFixed(2)} pp/min` : null,
    ].filter(Boolean).join('\n');
    const bounds = plotArea.getBoundingClientRect();
    tooltip.hidden = false;
    tooltip.style.left = `${Math.max(0, Math.min(event.clientX - bounds.left + 12, bounds.width - tooltip.offsetWidth))}px`;
    tooltip.style.top = `${Math.max(0, event.clientY - bounds.top - tooltip.offsetHeight - 8)}px`;
  });
  return card;
}
async function refresh() {
  try {
    const response = await fetch('/samples');
    if (!response.ok) throw new Error();
    const data = await response.json();
    const now = Date.now() / 1000;
    const last = data.samples.at(-1);
    latest.textContent = last ? [
      'Last 24 hours', new Date(last.unix_time * 1000).toLocaleTimeString(),
      last.on_ac === 1 ? 'Plugged in' : last.on_ac === 0 ? 'On battery' : 'Power source unknown',
      last.battery_percent == null ? null : `${last.battery_percent.toFixed(1)}% charge`,
      `${data.samples.length} samples`,
    ].filter(Boolean).join(' · ') : 'Waiting for the first sample.';
    charts.replaceChildren(...metrics.map(metric => chart(data.samples, metric, now)));
    processes.replaceChildren(...data.processes.map(process => {
      const row = document.createElement('tr');
      row.insertCell().textContent = process.name;
      row.insertCell().textContent = (process.cpu_seconds / 60).toFixed(1);
      return row;
    }));
  } catch {
    latest.textContent = 'Could not load energy readings. Retrying in one minute.';
  }
}
refresh();
setInterval(refresh, 60000);
</script>
</html>
