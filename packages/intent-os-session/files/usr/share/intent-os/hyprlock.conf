# Intent OS lock screen: clock and a PIN field. The PIN is the owner's
# Linux password (PAM).
general {
  hide_cursor = false
  ignore_empty_input = true
}

background {
  monitor =
  color = rgb(11, 11, 12)
}

label {
  monitor =
  text = cmd[update:30000] date +"%H:%M"
  color = rgb(228, 228, 231)
  font_size = 72
  font_family = Inter
  position = 0, 110
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 260, 52
  rounding = 12
  outline_thickness = 1
  dots_size = 0.22
  dots_spacing = 0.45
  dots_center = true
  outer_color = rgb(63, 63, 70)
  inner_color = rgb(24, 24, 27)
  font_color = rgb(228, 228, 231)
  check_color = rgb(161, 161, 170)
  fail_color = rgb(248, 113, 113)
  placeholder_text = <span foreground="##a1a1aa">Enter PIN</span>
  fail_text = Wrong PIN
  fade_on_empty = false
  position = 0, -20
  halign = center
  valign = center
}
